---
- name: Setup Kubernetes Tooling & Tmux on Multi-OS Nodes
  hosts: k8s_nodes
  become: true

  tasks:
    - name: Install tmux on Debian/Ubuntu
      apt:
        name: tmux
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: Install tmux on Rocky Linux
      dnf:
        name: tmux
        state: present
        update_cache: yes
      when: ansible_os_family == "RedHat"

    - name: Install prerequisites (Debian Family)
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gpg
        state: present
      when: ansible_os_family == "Debian"

    - name: Add Kubernetes GPG Key 
      get_url:
        url: https://pkgs.k8s.io/core:/stable:/v1.30/deb/Release.key
        dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
        mode: '0644'
      when: ansible_os_family == "Debian"

    - name: Add Kubernetes Apt Repository 
      apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.asc] https://pkgs.k8s.io/core:/stable:/v1.30/deb/ /"
        state: present
        filename: kubernetes
      when: ansible_os_family == "Debian"

    - name: Install K8s tools
      apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: Add Kubernetes YUM Repository
      yum_repository:
        name: kubernetes
        description: Kubernetes
        baseurl: https://pkgs.k8s.io/core:/stable:/v1.30/rpm/
        enabled: true
        gpgcheck: true
        gpgkey: https://pkgs.k8s.io/core:/stable:/v1.30/rpm/repodata/repomd.xml.key
      when: ansible_os_family == "RedHat"

    - name: Install K8s tools 
      dnf:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present
      when: ansible_os_family == "RedHat"

    - name: Verify kubectl installation
      command: kubectl version --client
      register: kubectl_check
      changed_when: false

    - name: Show kubectl status
      debug:
        msg: "{{ kubectl_check.stdout }}"