# This is in the Namespace level.
apiVersion: v1
kind: LimitRange
metadata:
  name: cpu-ram-limit-range
  namespace: berkay-namespaces
spec:
  limits:
  - type: Container
    default: 
      cpu: "500m"
      memory: "256Mi"
    defaultRequest:
      cpu: "200m"
      memory: "128Mi"
    max:
      cpu: "2"         # Max 2 CPU core
      memory: "2Gi"    # Max 2 GB
    min:
      cpu: "100m"      
      memory: "64Mi"
