# This is for each pod-container
apiVersion: v1
kind: LimitRange
metadata:
  name: cpu-ram-limit-range
  namespace: berkay-namespaces
spec:
  limits:
    - type: Container
      default:
        cpu: "500m"
        memory: "256Mi"
      defaultRequest:
        cpu: "200m"
        memory: "128Mi"
      max:
        cpu: "1.5" # 1500m
        memory: "2Gi" # Max 2 GB
      min:
        cpu: "100m"
        memory: "64Mi"
      maxLimitRequestRatio:
        cpu: "10"
        memory: "8"
    - type: Pod
      min:
        cpu: "100m"
        memory: "128Mi"
      max:
        cpu: "2"
        memory: "3Gi"
      maxLimitRequestRatio:
        cpu: "10"
        memory: "8"
---
# This is for the total of the Namespace.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: resource-quota
  namespace: berkay-namespaces
spec:
  hard:
    requests.cpu: "2"
    requests.memory: "2Gi"
    limits.cpu: "4"
    limits.memory: "4Gi"
    pods: "10"
