apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: production-critical
value: 1000000
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: "Mission-critical production services that must preempt lower-priority workloads."

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-gateway
  namespace: berkay-namespace
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-gateway
  template:
    metadata:
      labels:
        app: payment-gateway
    spec:
      priorityClassName: production-critical
      containers:
        - name: api
          image: payment-service:v1.4
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
